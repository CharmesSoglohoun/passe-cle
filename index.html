<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passe-Clé · Logement étudiant à Rennes (démo)</title>
<meta name="description" content="Prototype de démonstration : logements de passation entre étudiants à Rennes, avec visite virtuelle pièce par pièce. Annonces et coordonnées fictives.">
<meta name="robots" content="noindex">
<style>[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : site à vues (accueil, recherche, fiche, visite, publier, espace, messages), conteneur 1200px, mobile d'abord avec barre d'onglets en bas */
:root{
  --bg:#FFFFFF; --soft:#F5F3EE; --card:#FFFFFF; --line:#E3DFD6; --ink:#17201C; --muted:#56605B;
  --sapin:#1E4A3D; --sapin-soft:#E4EEE9; --on-sapin:#FFFFFF;
  --corail:#C2452A; --corail-soft:#FBE7E1; --on-corail:#FFFFFF; --or:#F2B33D;
  --ph1:#DCD5C8; --ph2:#C7D4CC; --ph3:#D9CDBF; --ph-ink:#3E4642; --ph-line:rgba(23,32,28,.18);
  --map:#EEF0EA; --map-park:#D5E3D4; --map-water:#C9DCE6; --map-road:#E3E0D8; --lineA:#C2452A; --lineB:#2F8A6A;
  --shadow:0 14px 36px rgba(23,32,28,.09);
  --f-display:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Figtree', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --soft:#161E1B; --card:#1A2320; --line:#2D3934; --ink:#ECF0ED; --muted:#A6B2AC;
  --sapin:#8CCBB2; --sapin-soft:#1F3029; --on-sapin:#0F1513; --corail:#E46E50; --corail-soft:#3A231C; --on-corail:#160B07;
  --ph1:#4A453E; --ph2:#3D4A44; --ph3:#4D4339; --ph-ink:#2A302D; --ph-line:rgba(255,255,255,.14);
  --map:#1B2421; --map-park:#22352C; --map-water:#1F3340; --map-road:#26302C; --lineA:#E46E50; --lineB:#5FC59C;
  --shadow:0 14px 36px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --soft:#161E1B; --card:#1A2320; --line:#2D3934; --ink:#ECF0ED; --muted:#A6B2AC;
  --sapin:#8CCBB2; --sapin-soft:#1F3029; --on-sapin:#0F1513; --corail:#E46E50; --corail-soft:#3A231C; --on-corail:#160B07;
  --ph1:#4A453E; --ph2:#3D4A44; --ph3:#4D4339; --ph-ink:#2A302D; --ph-line:rgba(255,255,255,.14);
  --map:#1B2421; --map-park:#22352C; --map-water:#1F3340; --map-road:#26302C; --lineA:#E46E50; --lineB:#5FC59C;
  --shadow:0 14px 36px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--bg)}
h1,h2,h3,.d{font-family:var(--f-display); letter-spacing:-.02em; text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--sapin)} a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--or); outline-offset:2px}
.wrap{max-width:1200px; margin:0 auto}
.muted{color:var(--muted)}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.stack{display:flex; flex-direction:column}
.icon{width:20px; height:20px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* En-tête */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line); margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px))}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand-mark{width:36px; height:36px; border-radius:10px; background:var(--sapin); color:var(--on-sapin); display:grid; place-items:center}
.brand-name{font-family:var(--f-display); font-weight:800; font-size:22px; letter-spacing:-.02em}
.nav{display:flex; align-items:center; gap:4px}
.nav a{min-height:44px; display:flex; align-items:center; padding:0 12px; border-radius:10px; text-decoration:none; color:var(--ink); font-weight:600}
.nav a[aria-current="page"]{background:var(--sapin-soft); color:var(--sapin)}
.nav .login{background:var(--ink); color:var(--bg); border-radius:999px; padding:0 18px; margin-left:6px}
.nav .login:hover{color:var(--bg)}
.tabbar{display:none}
@media (max-width:760px){
  .nav a:not(.login){display:none}
  .tabbar{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg); border-top:1px solid var(--line);
    padding:6px max(4px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px))}
  .tabbar a{min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; font-weight:600; color:var(--muted); text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--sapin); font-weight:700}
  main{padding-bottom:84px}
}

/* Boutons, puces, badges */
.btn{min-height:48px; padding:0 20px; border-radius:14px; border:0; font-weight:700; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; cursor:pointer}
.btn-lg{min-height:54px; padding:0 24px; font-size:17px}
.btn-primary{background:var(--corail); color:var(--on-corail)} .btn-primary:hover{color:var(--on-corail); filter:brightness(1.06)}
.btn-sapin{background:var(--sapin); color:var(--on-sapin)} .btn-sapin:hover{color:var(--on-sapin); filter:brightness(1.08)}
.btn-outline{background:var(--bg); color:var(--ink); border:1.5px solid var(--ink)}
.btn-quiet{background:var(--bg); color:var(--ink); border:1.5px solid var(--line)}
.btn[disabled]{background:var(--line); color:var(--muted); cursor:not-allowed; filter:none}
.icon-btn{width:48px; height:48px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg); display:grid; place-items:center; cursor:pointer; flex:0 0 auto}
.icon-btn[aria-pressed="true"]{color:var(--corail); border-color:var(--corail); background:var(--corail-soft)}
.icon-btn[aria-pressed="true"] .icon{fill:currentColor}
.chip{min-height:44px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--bg); font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--ink); text-decoration:none}
.chip[aria-pressed="true"]{border-color:var(--sapin); background:var(--sapin); color:var(--on-sapin)}
.badge{font-size:12px; font-weight:700; padding:5px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; line-height:1.2}
.b-white{background:#FFFFFF; color:#1E4A3D} .b-sapin{background:#1E4A3D; color:#FFFFFF}
.b-soft{background:var(--sapin-soft); color:var(--sapin)} .b-line{border:1px solid var(--line); color:var(--ink)}
.b-dark{background:#17201C; color:#FFFFFF}

/* Photos (emplacements) */
.ph{position:relative; overflow:hidden; background:var(--ph1); color:var(--ph-ink)}
.ph.t2{background:var(--ph2)} .ph.t3{background:var(--ph3)}
.ph svg.motif{position:absolute; left:50%; top:50%; width:44%; max-width:180px; transform:translate(-50%,-56%); stroke:var(--ph-line); fill:none; stroke-width:1.5}
.ph .ph-label{position:absolute; left:10px; bottom:10px; font-size:12px; font-weight:600; background:rgba(255,255,255,.82); color:#3E4642; padding:4px 9px; border-radius:999px}
.ph .badges{position:absolute; top:10px; left:10px; display:flex; flex-wrap:wrap; gap:6px; right:10px}
.ph img.photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.ph .ph-label,.ph .badges,.gallery .start{z-index:1}

/* Champs */
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field label,.label{font-weight:700; font-size:14px}
.input{min-height:50px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font-size:16px; width:100%}
textarea.input{padding:12px 14px; min-height:96px; resize:vertical}
.input:focus{border-color:var(--sapin); outline:none; box-shadow:0 0 0 3px var(--sapin-soft)}
.hint{font-size:13px; color:var(--muted)}
.check{min-height:44px; display:flex; align-items:center; gap:10px; cursor:pointer}
.check input{width:22px; height:22px; accent-color:var(--sapin); flex:0 0 auto}

/* Accueil */
.hero{display:flex; flex-wrap:wrap; gap:40px; align-items:center; padding-block:48px 28px}
.hero-text{flex:1 1 460px; min-width:0; display:flex; flex-direction:column; gap:18px}
.eyebrow{align-self:flex-start; font-size:14px; font-weight:700; color:var(--sapin); background:var(--sapin-soft); padding:6px 12px; border-radius:999px}
.hero h1{font-size:clamp(38px, 6vw, 66px); line-height:1.02; font-weight:800}
.hero .lead{font-size:clamp(17px, 2vw, 20px); color:var(--muted); max-width:34em}
.hero-photos{flex:1 1 380px; min-width:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.hero-photos .ph{border-radius:22px; min-height:170px}
.hero-photos .ph:first-child{grid-row:span 2; min-height:352px}
.searchbar{padding:14px; border-radius:22px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(210px,100%),1fr)); gap:12px; align-items:end}
.section{padding-block:56px 0; display:flex; flex-direction:column; gap:18px}
.section-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:10px}
.section h2{font-size:clamp(24px, 3vw, 32px); font-weight:700}
.campus-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px,100%),1fr)); gap:10px}
.campus{min-height:76px; padding:14px 18px; border-radius:16px; border:1px solid var(--line); background:var(--soft); color:var(--ink); text-decoration:none; display:flex; justify-content:space-between; align-items:center; gap:10px; font-weight:700}
.campus:hover{border-color:var(--sapin)}
.how{padding:44px clamp(20px, 4vw, 40px); border-radius:28px; background:var(--sapin); color:var(--on-sapin)}
.how ol{list-style:none; margin:28px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px,100%),1fr)); gap:28px}
.how .n{font-family:var(--f-display); font-size:52px; font-weight:800; line-height:1; color:var(--or)}
.trust{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(280px,100%),1fr)); gap:14px}
.trust > div{padding:22px; border-radius:20px; border:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
.foot{margin-top:72px; border-top:1px solid var(--line); padding-block:28px 40px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; color:var(--muted)}

/* Cartes logement */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(270px,100%),1fr)); gap:26px 20px}
.lcard{display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--ink); position:relative}
.lcard .ph{height:210px; border-radius:16px}
.lcard .fav{position:absolute; top:160px; right:10px; width:44px; height:44px; border-radius:999px; border:0; background:var(--bg); display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lcard .fav[aria-pressed="true"]{color:var(--corail)} .lcard .fav[aria-pressed="true"] .icon{fill:currentColor}
.price{font-family:var(--f-display); font-weight:800; font-size:26px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.lcard .trip{color:var(--sapin); font-weight:600; font-size:15px}
.lcard.active .ph{outline:3px solid var(--corail); outline-offset:3px}

/* Résultats */
.res-head{padding-block:20px 12px; display:flex; flex-direction:column; gap:12px}
.filters-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.filters-row > *{flex:0 0 auto}
.panel{padding:20px; border-radius:20px; background:var(--soft); display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px,100%),1fr)); gap:18px 24px}
.res-body{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; padding-bottom:40px}
.res-list{flex:999 1 520px; min-width:0}
.res-map{flex:1 1 380px; min-width:0; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 84px)}
.mapbox{position:relative; border-radius:20px; overflow:hidden; background:var(--map); aspect-ratio:1/1.05; max-width:100%; border:1px solid var(--line)}
.mapbox svg{display:block; width:100%; height:100%}
.pin{position:absolute; transform:translate(-50%,-50%); min-height:36px; padding:0 12px; border-radius:999px; border:1.5px solid var(--ink); background:var(--card); color:var(--ink); font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap; font-variant-numeric:tabular-nums}
.pin[aria-pressed="true"]{background:var(--corail); border-color:var(--corail); color:var(--on-corail); z-index:2}
.legend{position:absolute; top:12px; left:12px; padding:8px 12px; border-radius:12px; background:var(--card); border:1px solid var(--line); font-size:13px; font-weight:600; display:flex; flex-direction:column; gap:4px}
.legend span{display:flex; align-items:center; gap:8px}
.legend i{display:inline-block; width:22px; height:5px; border-radius:3px}
.viewtoggle{display:none}
@media (max-width:900px){
  .res-map{position:static; flex-basis:100%}
  .viewtoggle{display:inline-flex}
  .res-body[data-view="list"] .res-map{display:none}
  .res-body[data-view="map"] .res-list{display:none}
}
.empty{padding:40px 20px; text-align:center; border-radius:20px; border:1.5px dashed var(--line); display:flex; flex-direction:column; gap:10px; align-items:center}

/* Fiche */
.back{min-height:44px; display:inline-flex; align-items:center; gap:6px; font-weight:600; margin-top:12px}
.gallery{display:grid; grid-template-columns:2fr 1fr 1fr; grid-template-rows:200px 200px; gap:10px; margin-top:16px}
.gallery button{border:0; padding:0; border-radius:18px; cursor:pointer; text-align:left}
.gallery .main{grid-row:span 2}
.gallery .start{position:absolute; left:16px; bottom:16px}
@media (max-width:700px){
  .gallery{grid-template-columns:repeat(4, minmax(0,1fr)); grid-template-rows:280px 76px; margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
  .gallery .main{grid-column:1 / -1; grid-row:auto; border-radius:0}
  .gallery button:not(.main){border-radius:10px}
  .gallery button:not(.main) .ph-label{display:none}
}
.detail{display:flex; flex-wrap:wrap; gap:40px; align-items:flex-start; padding-block:28px 48px}
.detail-main{flex:999 1 540px; min-width:0; display:flex; flex-direction:column; gap:40px}
.detail-side{flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:14px; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 84px)}
@media (max-width:900px){.detail-side{position:static}}
.facts{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(140px,100%),1fr)); gap:14px; padding:20px; border-radius:20px; background:var(--soft)}
.facts strong{display:block; font-size:17px}
.facts span{font-size:14px; color:var(--muted)}
.costs{border:1px solid var(--line); border-radius:18px; overflow:hidden}
.costs > div{display:flex; justify-content:space-between; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.costs > div:last-child{border-bottom:0; background:var(--sapin-soft); font-weight:700}
.note{display:flex; gap:12px; padding:14px 16px; border-radius:16px; background:var(--soft); line-height:1.45}
.scam{display:flex; gap:12px; padding:14px 16px; border-radius:16px; border:1.5px dashed var(--muted); line-height:1.45}
.equip{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(180px,100%),1fr)); gap:14px}
.equip li{display:flex; align-items:center; gap:10px} .equip .icon{color:var(--sapin); width:22px; height:22px}
.dpe{display:flex; flex-direction:column; gap:4px}
.dpe div{display:flex; align-items:center; gap:10px}
.dpe span{height:28px; border-radius:4px 14px 14px 4px; font-weight:800; display:flex; align-items:center; padding-left:10px}
.dpe .on span{outline:2.5px solid var(--ink); outline-offset:2px}
.tablebox{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums}
th,td{text-align:left; padding:11px 8px 11px 0; border-top:1px solid var(--line); vertical-align:top}
thead th{border-top:0; color:var(--muted); font-weight:600}
.sidecard{padding:22px; border-radius:22px; border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px}
.avatar{width:48px; height:48px; border-radius:999px; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:18px; flex:0 0 auto}
.av-sapin{background:var(--sapin-soft); color:var(--sapin)} .av-corail{background:var(--corail); color:var(--on-corail)}
.masked{padding:12px 14px; border-radius:12px; background:var(--soft); display:flex; align-items:center; gap:10px}
.coord{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--soft)}
.coord strong{user-select:all; font-variant-numeric:tabular-nums}
.leaver{padding:24px; border-radius:22px; background:var(--corail-soft); display:flex; flex-direction:column; gap:14px}
.mobile-cta{display:none}
@media (max-width:760px){
  .mobile-cta{display:flex; position:fixed; left:0; right:0; bottom:calc(68px + env(safe-area-inset-bottom, 0px)); z-index:19; gap:10px; align-items:center; background:var(--bg); border-top:1px solid var(--line);
    padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px))}
  .detail{padding-bottom:110px}
}

/* Visite */
.tour{position:fixed; inset:0; z-index:50; background:#0B100E; color:#F2F4F2; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)}
.tour-top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px}
.tour-top button,.tour-nav{border:0; background:rgba(255,255,255,.12); color:#FFFFFF; border-radius:999px; display:grid; place-items:center; cursor:pointer}
.tour-top button{width:48px; height:48px}
.tour-bars{display:grid; gap:4px; padding:0 16px 10px}
.tour-bars i{height:4px; border-radius:2px; background:rgba(255,255,255,.22)}
.tour-bars i.on{background:#E46E50}
.tour-stage{position:relative; flex:1; min-height:0; margin:0 16px; border-radius:18px; touch-action:pan-y; user-select:none}
.tour-stage.ph{background:#0B100E}
.tour-stage img.photo{object-fit:contain}
.tour-stage .ph-label{left:12px; bottom:12px; font-size:14px}
.tour-nav{z-index:2; border:1.5px solid rgba(255,255,255,.45)}
.tour-nav{position:absolute; top:50%; width:56px; height:56px; margin-top:-28px; background:rgba(11,16,14,.72)}
.tour-nav.prev{left:12px} .tour-nav.next{right:12px}
.tour-info{padding:14px 16px 6px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; max-width:1200px}
.tour-info h2{font-size:28px; font-weight:800}
.tour-info p{flex-basis:100%; color:#D5DCD8; max-width:60ch}
.tour-thumbs{display:flex; gap:8px; padding:6px 16px; overflow-x:auto}
.tour-thumbs button{flex:0 0 64px; height:48px; border-radius:8px; border:2.5px solid transparent; cursor:pointer; padding:0}
.tour-thumbs button[aria-current="true"]{border-color:#F2B33D}
.tour-rooms{display:flex; gap:6px; padding:8px 16px; overflow-x:auto}
.tour-rooms button{flex:0 0 auto; min-height:44px; padding:0 14px; border-radius:999px; border:0; background:rgba(255,255,255,.12); color:#F2F4F2; font-weight:600; cursor:pointer}
.tour-rooms button[aria-current="step"]{background:#FFFFFF; color:#0B100E}
.tour-foot{display:flex; gap:10px; padding:8px 16px 16px}
.tour-foot .btn-primary{background:#E46E50; color:#160B07}

/* Pages formulaire */
.narrow{max-width:640px; margin:0 auto; padding-block:28px 48px; display:flex; flex-direction:column; gap:20px}
.progress{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:4px}
.progress i{height:6px; border-radius:3px; background:var(--line)} .progress i.on{background:var(--sapin)}
.room-item{padding:12px; border-radius:16px; border:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; gap:10px}
.room-item.dragging{opacity:.5}
.room-item .head{display:flex; align-items:center; gap:8px}
.thumbs{display:flex; flex-wrap:wrap; gap:8px}
.thumb{width:72px; height:58px; border-radius:10px; overflow:hidden; background:var(--ph2)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.add-photo{width:72px; height:58px; border-radius:10px; border:1.5px dashed var(--muted); display:grid; place-items:center; cursor:pointer; position:relative}
.add-photo input{position:absolute; inset:0; opacity:0; cursor:pointer}
.consent{padding:14px; border-radius:14px; border:2px solid var(--corail); background:var(--corail-soft); display:flex; gap:12px; align-items:flex-start; cursor:pointer}
.consent.ok{border-color:var(--sapin)}
.consent input{width:24px; height:24px; flex:0 0 auto; margin:0; accent-color:var(--sapin)}
.stepfoot{display:flex; gap:10px; position:sticky; bottom:0; background:var(--bg); padding-block:12px; border-top:1px solid var(--line)}
@media (max-width:760px){.stepfoot{bottom:calc(68px + env(safe-area-inset-bottom, 0px))}}
.seg{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:4px; padding:4px; border-radius:14px; background:var(--soft)}
.seg button{min-height:46px; border-radius:10px; border:0; background:transparent; font-weight:700; cursor:pointer}
.seg button[aria-selected="true"]{background:var(--bg); box-shadow:0 1px 4px rgba(0,0,0,.12)}
.list-item{display:flex; gap:12px; align-items:center; padding:10px; border-radius:14px; border:1px solid var(--line); text-decoration:none; color:var(--ink)}
.list-item .ph{width:76px; height:66px; border-radius:10px; flex:0 0 auto}
.switch{width:52px; height:32px; flex:0 0 auto; border-radius:999px; border:0; padding:3px; background:var(--muted); display:flex; justify-content:flex-start; cursor:pointer}
.switch[aria-checked="true"]{background:var(--sapin); justify-content:flex-end}
.switch span{width:26px; height:26px; border-radius:999px; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.stats div{padding:10px; border-radius:12px; background:var(--soft)}
.stats strong{display:block; font-family:var(--f-display); font-size:22px; font-variant-numeric:tabular-nums}

/* Messagerie */
.chat{max-width:720px; margin:0 auto; padding-block:16px; display:flex; flex-direction:column; gap:12px; min-height:70vh}
.convs{display:flex; gap:8px; overflow-x:auto}
.bubbles{flex:1; display:flex; flex-direction:column; gap:8px; padding:8px 0}
.bubble{max-width:78%; padding:10px 14px; border-radius:18px 18px 18px 4px; background:var(--soft); line-height:1.4}
.bubble.me{align-self:flex-end; border-radius:18px 18px 4px 18px; background:var(--sapin); color:var(--on-sapin)}
.composer{display:flex; gap:8px; align-items:center}
.composer .input{border-radius:999px}

.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:600; box-shadow:var(--shadow); max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion: no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(6px)} to{transform:none}}
}

function filtered(){
  let r = LISTINGS.filter(l => total(l) <= S.q.budget
    && (!S.f.types.length || S.f.types.includes(l.kind))
    && (!S.f.meuble || l.meuble) && (!S.f.apl || l.apl) && (!S.f.metro || l.metro) && (!S.f.pets || l.pets)
    && (!S.f.maxTrip || (l.trips[S.q.campus] && l.trips[S.q.campus][0] <= S.f.maxTrip))
    && (!S.f.minArea || l.area >= S.f.minArea));
  if (S.sort === 'campus') r.sort((a,b) => a.trips[S.q.campus][0] - b.trips[S.q.campus][0]);
  if (S.sort === 'prix') r.sort((a,b) => total(a) - total(b));
  if (S.sort === 'recent') r.sort((a,b) => b.id - a.id);
  return r;
}

    </div>`;

      <div class="field"><label for="code">Code reçu par e-mail</label><input class="input" id="code" inputmode="numeric" autocomplete="one-time-code" value="482913"><span class="hint">Démo : n’importe quel code à 6 chiffres fonctionne.</span></div>
      <button class="btn btn-primary" type="submit">Valider et voir les coordonnées</button></form>`;
  return `<div class="stack" style="gap:10px">
      <div class="masked">${ic('lock')}<span>${esc(l.landlord.tel.slice(0,2))} •• •• •• •• · e-mail masqué</span></div>

      <span class="hint">Réservé aux étudiants vérifiés, pour protéger les bailleurs du démarchage et limiter les arnaques.</span>
    </div>`;

function bindCoord(l){
  const box = document.getElementById('coordBox');
  const redraw = () => { box.innerHTML = coordBox(l); bindCoord(l); };
  const vf = document.getElementById('verifForm');
  if (vf) vf.addEventListener('submit', e => { e.preventDefault(); S.codeSent = true; toast('Code de vérification envoyé (démo)'); redraw(); document.getElementById('code').focus(); });
  const cf = document.getElementById('codeForm');
  if (cf) cf.addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('code').value.trim();
    if (!/^\d{6}$/.test(v)) { toast('Le code contient 6 chiffres.'); return; }
    S.verified = true; S.user = S.user || 'Camille'; setNav(currentRoute()); toast('Profil vérifié'); redraw();
  });
  box.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
    const txt = b.dataset.copy;
    Promise.resolve().then(() => navigator.clipboard.writeText(txt)).then(() => toast('Copié : ' + txt)).catch(() => {
      const s = b.parentElement.querySelector('strong'); const r = document.createRange(); r.selectNodeContents(s);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Texte sélectionné, copiez-le avec Ctrl+C');
    });
  }));
}

/* ---------- Visite virtuelle ---------- */
let tourState = null;
function openTour(l, room){
  tourState = {l, r:room, p:0, last:document.activeElement};
  document.body.style.overflow = 'hidden';
  renderTour();
  document.addEventListener('keydown', tourKeys);
}
function closeTour(){
  document.getElementById('tourRoot').innerHTML = '';
  document.body.style.overflow = '';
  document.removeEventListener('keydown', tourKeys);
  if (tourState && tourState.last) tourState.last.focus();
  tourState = null;
}
function tourMove(d){
  const t = tourState, rooms = t.l.rooms;
  if (d > 0) { if (t.p < rooms[t.r].n - 1) t.p++; else if (t.r < rooms.length - 1) { t.r++; t.p = 0; } }
  else { if (t.p > 0) t.p--; else if (t.r > 0) { t.r--; t.p = rooms[t.r].n - 1; } }
  renderTour();
}
function tourKeys(e){
  if (!tourState) return;
  if (e.key === 'Escape') closeTour();
  if (e.key === 'ArrowRight') tourMove(1);
  if (e.key === 'ArrowLeft') tourMove(-1);
}
function renderTour(){
  const t = tourState, rooms = t.l.rooms, room = rooms[t.r];
  const tone = (t.r + t.p) % 3 + 1;
  const root = document.getElementById('tourRoot');
  root.innerHTML = `<div class="tour" role="dialog" aria-modal="true" aria-label="Visite virtuelle">
    <div class="tour-top">
      <div class="stack"><span style="font-size:13px;color:#B7C2BC">Étape ${t.r + 1} sur ${rooms.length} · photo ${t.p + 1} / ${room.n}</span><strong>${esc(title(t.l))} · ${esc(t.l.where)}</strong></div>
      <button type="button" id="tClose" aria-label="Fermer la visite">${ic('close')}</button>
    </div>
    <div class="tour-bars" style="grid-template-columns:repeat(${rooms.length}, minmax(0,1fr))">${rooms.map((x,i) => `<i class="${i <= t.r ? 'on' : ''}"></i>`).join('')}</div>
    <div class="tour-stage ph t${tone}" id="stage">${img(photoFor(t.l, t.r, t.p), true)}<span class="ph-label">Photo ${t.p + 1} · ${esc(room.name)}</span>
      <button type="button" class="tour-nav prev" id="tPrev" aria-label="Photo précédente">${ic('left')}</button>
      <button type="button" class="tour-nav next" id="tNext" aria-label="Photo suivante">${ic('right')}</button>
    </div>
    <div class="tour-info"><h2>${esc(room.name)}</h2><span style="color:#B7C2BC;font-weight:600">${esc(room.area)}</span><p>${esc(room.desc)}</p></div>
    <div class="tour-thumbs">${Array.from({length:room.n}, (x,i) => `<button type="button" class="ph t${(t.r + i) % 3 + 1}" data-ph="${i}" aria-label="Photo ${i + 1}" aria-current="${i === t.p}">${img(photoFor(t.l, t.r, i), true)}</button>`).join('')}</div>
    <nav class="tour-rooms" aria-label="Pièces">${rooms.map((x,i) => `<button type="button" data-room="${i}" aria-current="${i === t.r ? 'step' : 'false'}">${esc(x.name.replace(' et parties communes',''))}</button>`).join('')}</nav>
    <div class="tour-foot"><button type="button" class="btn btn-primary" style="flex:1;max-width:420px" id="tContact">Contacter le bailleur</button></div>
  </div>`;
  document.getElementById('tClose').addEventListener('click', closeTour);
  document.getElementById('tPrev').addEventListener('click', () => tourMove(-1));
  document.getElementById('tNext').addEventListener('click', () => tourMove(1));
  root.querySelectorAll('[data-ph]').forEach(b => b.addEventListener('click', () => { t.p = +b.dataset.ph; renderTour(); }));
  root.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => { t.r = +b.dataset.room; t.p = 0; renderTour(); }));
  document.getElementById('tContact').addEventListener('click', () => { closeTour(); const c = document.getElementById('contact'); if (c) c.scrollIntoView({behavior:'smooth'}); });
  const st = document.getElementById('stage'); let x0 = null;
  st.addEventListener('pointerdown', e => { x0 = e.clientX; });
  st.addEventListener('pointerup', e => { if (x0 !== null && Math.abs(e.clientX - x0) > 40) tourMove(e.clientX < x0 ? 1 : -1); x0 = null; });
  document.getElementById('tClose').focus();
}

  }
  if (step === 4) document.getElementById('consent').addEventListener('change', e => { P.consent = e.target.checked; viewPublish(); document.getElementById('consent').focus(); });
  const pub = document.getElementById('pPublish');
  if (pub) pub.addEventListener('click', () => {
    const base = LISTINGS[0];
    S.mine.push(Object.assign({}, base, {id:100 + S.mine.length, kind:P.type, verified:false, leaver:Object.assign({}, base.leaver, {name:S.user || 'Vous'})}));
    S.pub = {step:1, type:'Studio', consent:false, rooms:P.rooms};
    S.espaceTab = 'leave';
    toast('Annonce publiée. Elle sera vérifiée avant d’apparaître.');
    location.hash = 'espace';
  });
}
function cardPreview(){
  const P = S.pub;
  const cover = (P.rooms[1] && P.rooms[1][1][0]) || 'photos/piece-1.jpg';
  return `<div class="lcard">${ph('Photo · ' + P.rooms[1][0], 1, '', `<span class="badge b-white">${ic('camera')}Visite virtuelle · ${P.rooms.length} pièces</span>`, cover)}
    <div class="stack" style="gap:2px"><div class="row" style="gap:6px;align-items:baseline"><span class="price">430 €</span><span class="muted">CC / mois</span></div><strong>${esc(P.type)} · 22 m² · Villejean</strong><span class="trip">5 min à pied de Rennes 2 Villejean</span><span class="muted">Disponible le 1er juillet</span></div></div>`;
}
function bindRooms(){
  const P = S.pub;
  app.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.up; if (!i) return; const r = P.rooms; [r[i-1], r[i]] = [r[i], r[i-1]]; viewPublish();
    const nb = app.querySelector(`[data-up="${i-1}"]`); if (nb && !nb.disabled) nb.focus();
  }));
  app.querySelectorAll('[data-add]').forEach(inp => inp.addEventListener('change', () => {
    const i = +inp.dataset.add; const files = Array.from(inp.files || []).slice(0, 4);
    let left = files.length; if (!left) return;
    files.forEach(f => { const fr = new FileReader(); fr.onload = () => { P.rooms[i][1].push(fr.result); if (--left === 0) viewPublish(); }; fr.readAsDataURL(f); });
  }));
  let from = null;
  app.querySelectorAll('.room-item').forEach(li => {
    li.addEventListener('dragstart', () => { from = +li.dataset.i; li.classList.add('dragging'); });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', e => e.preventDefault());
    li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.i; if (from === null || from === to) return; const [m] = P.rooms.splice(from, 1); P.rooms.splice(to, 0, m); from = null; viewPublish(); });
  });
  document.getElementById('addRoom').addEventListener('submit', e => {
    e.preventDefault(); const v = document.getElementById('newRoom').value.trim(); if (!v) return; P.rooms.push([v, []]); viewPublish();
  });
}

/* ---------- Espace personnel ---------- */
function viewSpace(){
  const seek = S.espaceTab === 'seek';
  const saved = LISTINGS.filter(l => S.saved.has(l.id));
  const mine = S.mine.length ? S.mine : [];
  app.innerHTML = `<div class="view narrow">
    <div class="row" style="gap:12px"><span class="avatar" style="background:var(--sapin);color:var(--on-sapin);width:56px;height:56px">${esc((S.user || 'C')[0])}</span><div class="stack"><span class="muted">Bonjour</span><h1 style="font-size:28px;font-weight:800">${esc(S.user || 'Camille')}</h1></div></div>
    <div class="note" style="background:var(--sapin-soft)"><span style="color:var(--sapin)">${ic('shield')}</span><div class="stack" style="gap:2px">
      ${S.verified ? '<strong>Profil étudiant vérifié</strong><span class="muted">Par e-mail universitaire. Vous pouvez voir les coordonnées des bailleurs.</span>' : '<strong>Profil pas encore vérifié</strong><span class="muted">Vérifiez votre e-mail universitaire depuis une annonce ou à l’inscription.</span><a href="#connexion" style="font-weight:700">Vérifier mon profil</a>'}</div></div>
    <div class="seg" role="tablist" aria-label="Mon profil"><button type="button" role="tab" aria-selected="${seek}" data-tab="seek">Je cherche</button><button type="button" role="tab" aria-selected="${!seek}" data-tab="leave">Je pars</button></div>
    ${seek ? `
      <section class="stack" style="gap:10px"><h2 style="font-size:22px;font-weight:700">Logements enregistrés · ${saved.length}</h2>
        ${saved.length ? saved.map(l => `<a class="list-item" href="#logement-${l.id}">${ph('',l.tone,'','',photoFor(l, 1))}<span class="stack"><span class="price" style="font-size:20px">${eur(total(l))} CC</span><strong style="font-size:15px">${esc(title(l))}</strong><span class="hint">${esc(l.where)}</span></span></a>`).join('') : '<div class="empty"><span class="muted">Touchez le cœur d’une annonce pour la retrouver ici.</span><a class="btn btn-sapin" href="#recherche">Chercher un logement</a></div>'}</section>
      <section class="stack" style="gap:10px"><h2 style="font-size:22px;font-weight:700">Mes alertes</h2>
        ${S.alerts.map((a,i) => `<div class="list-item" style="justify-content:space-between"><span class="stack"><strong style="font-size:15px">${esc(a.title)}</strong><span class="hint">${esc(a.sub)}</span></span><button type="button" class="switch" role="switch" aria-checked="${a.on}" data-alert="${i}" aria-label="Alerte ${esc(a.title)}"><span></span></button></div>`).join('')}
        <a class="btn btn-quiet" href="#recherche">Créer une alerte depuis une recherche</a></section>` : `
      <section class="stack" style="gap:10px"><h2 style="font-size:22px;font-weight:700">Mes annonces</h2>
        ${mine.length ? mine.map(l => `<div style="border:1px solid var(--line);border-radius:18px;overflow:hidden">
          ${ph('Photo · ' + l.rooms[1].name, 1, '', `<span class="badge ${S.given[l.id] ? 'b-dark' : 'b-line'}" style="background:${S.given[l.id] ? '#17201C' : '#FFFFFF'};color:${S.given[l.id] ? '#FFFFFF' : '#17201C'}">${S.given[l.id] ? 'Logement attribué' : 'En attente de vérification'}</span>`, photoFor(l, 1)).replace('class="ph t1 "','class="ph t1" style="height:150px"')}
          <div class="stack" style="gap:12px;padding:14px">
            <div class="stack"><strong class="d" style="font-size:21px">${esc(title(l))}</strong><span class="hint">${esc(l.where)} · ${eur(total(l))} CC · libre le ${esc(l.date)}</span></div>
            <div class="stats"><div><strong>0</strong><span class="hint">vues</span></div><div><strong>0</strong><span class="hint">messages</span></div><div><strong>0</strong><span class="hint">enregistrements</span></div></div>
            <div class="row" style="gap:8px"><a class="btn btn-quiet" style="flex:1" href="#publier">Modifier</a><button type="button" class="btn ${S.given[l.id] ? 'btn-quiet' : 'btn-sapin'}" style="flex:1.4" data-given="${l.id}" aria-pressed="${!!S.given[l.id]}">${S.given[l.id] ? 'Remettre en ligne' : 'Marquer comme attribué'}</button></div>
          </div></div>`).join('') : '<div class="empty"><strong>Vous n’avez pas encore d’annonce</strong><span class="muted">Publiez votre logement en moins de 10 minutes.</span><a class="btn btn-primary" href="#publier">Je libère mon logement</a></div>'}
      </section>`}
    <section class="stack" style="gap:10px"><h2 style="font-size:22px;font-weight:700">Messages</h2>
      ${Object.keys(S.convs).map(id => { const l = LISTINGS.find(x => x.id === +id); const m = S.convs[id]; const last = m[m.length - 1];
        return `<a class="list-item" href="#messages" data-chat="${id}"><span class="avatar av-corail">${esc(l.leaver.name[0])}</span><span class="stack" style="flex:1;min-width:0"><strong>${esc(l.leaver.name)} · ${esc(l.kind)} ${esc(l.where)}</strong><span class="hint" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(last.text)}</span></span></a>`; }).join('')}
    </section>
  </div>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { S.espaceTab = b.dataset.tab; viewSpace(); }));
  app.querySelectorAll('[data-alert]').forEach(b => b.addEventListener('click', () => { const a = S.alerts[+b.dataset.alert]; a.on = !a.on; b.setAttribute('aria-checked', a.on); toast(a.on ? 'Alerte activée' : 'Alerte désactivée'); }));
  app.querySelectorAll('[data-given]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.given; S.given[id] = !S.given[id]; toast(S.given[id] ? 'Logement marqué comme attribué' : 'Annonce remise en ligne'); viewSpace(); }));
  app.querySelectorAll('[data-chat]').forEach(a => a.addEventListener('click', () => { S.convWith = +a.dataset.chat; }));
}

/* ---------- Messagerie ---------- */
const REPLIES = {
  'Le logement est-il toujours disponible ?':'Oui, il est toujours disponible !',
  'Peut-on organiser une visite en visio ?':'Avec plaisir. Je suis libre jeudi à 18 h, ça vous va ?',
  'Le bailleur est-il facile à joindre ?':'Oui, il répond vite, plutôt par téléphone en fin de journée.'
};
function viewMessages(){
  const id = S.convWith; const l = LISTINGS.find(x => x.id === id) || LISTINGS[0];
  if (!S.convs[l.id]) S.convs[l.id] = [];
  const msgs = S.convs[l.id];
  app.innerHTML = `<div class="view chat">
    <div class="convs" role="tablist" aria-label="Conversations">${Object.keys(S.convs).map(k => { const x = LISTINGS.find(y => y.id === +k); return `<button type="button" class="chip" role="tab" aria-pressed="${+k === l.id}" aria-selected="${+k === l.id}" data-conv="${k}">${esc(x.leaver.name)} · ${esc(x.where)}</button>`; }).join('')}</div>
    <a class="list-item" href="#logement-${l.id}" style="background:var(--soft);border-color:transparent">${ph('',l.tone,'','',photoFor(l, 1))}<span class="stack" style="flex:1"><strong>${esc(title(l))} · ${esc(l.where)}</strong><span class="hint">${eur(total(l))} CC · libre le ${esc(l.date)}</span></span>${ic('right')}</a>
    <div class="row" style="gap:10px"><span class="avatar av-corail">${esc(l.leaver.name[0])}</span><div class="stack"><strong>${esc(l.leaver.name)}</strong><span class="hint">Étudiant·e sortant·e · ${esc(l.leaver.school)} · vérifié·e</span></div></div>
    <div class="bubbles" id="bubbles" aria-live="polite">${msgs.length ? msgs.map(m => `<div class="bubble${m.me ? ' me' : ''}">${esc(m.text)}</div>`).join('') : '<div class="empty"><strong>Démarrez la conversation</strong><span class="muted">Choisissez un message ci-dessous ou écrivez le vôtre.</span></div>'}</div>
    <div class="filters-row">${Object.keys(REPLIES).map(q => `<button type="button" class="chip" style="border-color:var(--sapin);color:var(--sapin)" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <form class="composer" id="composer"><label for="msg" class="sr">Votre message</label><input class="input" id="msg" placeholder="Votre message…" autocomplete="off"><button class="icon-btn" type="submit" aria-label="Envoyer" style="background:var(--corail);color:var(--on-corail);border:0;border-radius:999px">${ic('send')}</button></form>
  </div>`;
  const send = (text) => {
    msgs.push({me:true, text}); viewMessages();
    setTimeout(() => { msgs.push({me:false, text:REPLIES[text] || 'Merci pour votre message, je vous réponds vite !'}); if (currentRoute() === 'messages' && S.convWith === l.id) viewMessages(); }, 700);
  };
  app.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => send(b.dataset.q)));
  app.querySelectorAll('[data-conv]').forEach(b => b.addEventListener('click', () => { S.convWith = +b.dataset.conv; viewMessages(); }));
  document.getElementById('composer').addEventListener('submit', e => { e.preventDefault(); const v = document.getElementById('msg').value.trim(); if (v) send(v); });
  const bub = document.getElementById('bubbles'); const last = bub.lastElementChild; if (last && msgs.length) last.scrollIntoView({block:'nearest'});
}

/* ---------- Connexion ---------- */
function viewLogin(){
  app.innerHTML = `<div class="view narrow">
    <div class="seg" role="tablist" aria-label="Compte"><button type="button" role="tab" aria-selected="${!viewLogin.login}" data-m="0">Créer un compte</button><button type="button" role="tab" aria-selected="${!!viewLogin.login}" data-m="1">Se connecter</button></div>
    ${viewLogin.login ? `
      <h1 style="font-size:clamp(28px,4vw,36px);font-weight:800">Content de vous revoir</h1>
      <form class="stack" id="lf" style="gap:16px">
        <div class="field"><label for="l-mail">E-mail</label><input class="input" id="l-mail" type="email" required value="prenom.nom@etudiant.exemple.fr"></div>
        <div class="field"><label for="l-pw">Mot de passe</label><input class="input" id="l-pw" type="password" required value="motdepasse-demo"></div>
        <button class="btn btn-primary btn-lg" type="submit">Se connecter</button></form>` : `
      <h1 style="font-size:clamp(28px,4vw,36px);font-weight:800">Bienvenue sur Passe-Clé</h1>
      <form class="stack" id="sf" style="gap:16px">
        <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px"><legend class="label" style="margin-bottom:8px">Vous êtes ici pour…</legend>
          ${[['seek','Je cherche un logement','Visiter, enregistrer, créer des alertes'],['leave','Je libère mon logement','Publier et trouver mon successeur'],['both','Les deux','Je déménage d’un logement à un autre']].map((p,i) => `<label class="list-item" style="cursor:pointer"><input type="radio" name="prof" value="${p[0]}"${i === 0 ? ' checked' : ''} style="width:22px;height:22px;accent-color:var(--sapin)"><span class="stack"><strong>${p[1]}</strong><span class="hint">${p[2]}</span></span></label>`).join('')}
        </fieldset>
        <div class="row" style="gap:12px;align-items:flex-start"><div class="field" style="flex:1 1 160px"><label for="i-p">Prénom</label><input class="input" id="i-p" required value="Camille"></div><div class="field" style="flex:1 1 160px"><label for="i-e">Établissement</label><input class="input" id="i-e" value="Université Rennes 2"></div></div>
        <div class="field"><label for="i-m">E-mail universitaire</label><input class="input" id="i-m" type="email" required value="prenom.nom@etudiant.exemple.fr"><span class="hint">Avec votre e-mail universitaire, la vérification est immédiate. Sinon, envoyez un certificat de scolarité.</span></div>
        <div class="field"><label for="i-pw">Mot de passe</label><input class="input" id="i-pw" type="password" required minlength="12" value="motdepasse-demo"><span class="hint">12 caractères minimum.</span></div>
        <div class="field"><label for="i-cert">Certificat de scolarité (facultatif)</label><input class="input" id="i-cert" type="file" accept=".pdf,image/*" style="padding-top:12px"></div>
        <label class="check" style="align-items:flex-start"><input type="checkbox" required style="margin-top:2px">J’accepte les conditions d’utilisation et la charte de confiance de Passe-Clé.</label>
        <button class="btn btn-primary btn-lg" type="submit">Créer mon compte</button></form>`}
  </div>`;
  app.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { viewLogin.login = b.dataset.m === '1'; viewLogin(); }));
  const done = (name) => { S.user = name; S.verified = true; toast('Bienvenue ' + name + ', profil vérifié'); location.hash = 'espace'; };
  const sf = document.getElementById('sf'); if (sf) sf.addEventListener('submit', e => { e.preventDefault(); S.espaceTab = sf.prof.value === 'leave' ? 'leave' : 'seek'; done(document.getElementById('i-p').value.trim() || 'Camille'); });
  const lf = document.getElementById('lf'); if (lf) lf.addEventListener('submit', e => { e.preventDefault(); done('Camille'); });
}

/* ---------- Routeur ---------- */
function currentRoute(){ const h = location.hash.replace('#',''); return h.startsWith('logement-') ? 'logement' : (h || 'accueil'); }
function route(){
  if (tourState) closeTour();
  const h = location.hash.replace('#','');
  const r = currentRoute();
  if (r === 'logement') viewListing(+h.split('-')[1]);
  else if (r === 'recherche') viewSearch();
  else if (r === 'publier') viewPublish();
  else if (r === 'espace') viewSpace();
  else if (r === 'messages') viewMessages();
  else if (r === 'connexion') viewLogin();
  else if (r === 'contact') return;
  else viewHome();
  setNav(r === 'logement' ? 'recherche' : r);
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
})();
</script>
